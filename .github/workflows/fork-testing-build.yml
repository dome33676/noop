# Fork-only: ONE on-demand testing build that publishes ALL platforms into ONE release.
#
# A `meta` job creates a single dated prerelease, then the android / macOS / iOS jobs each attach
# their artifact to that SAME tag — so every release has NOOP-android + NOOP-android-debug (Android)
# + NOOP-macos.zip + NOOP-ios-unsigned.ipa together, each stamped with the base app version.
# Replaces the older split fork-testing-apk.yml + fork-testing-apple.yml.
# Unsigned/debug-keyed, no secrets. Trigger from the Actions tab. (Built from noop-staging via --ref.)
name: Testing build (fork)

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: testing-build
  cancel-in-progress: true

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.m.outputs.tag }}
      ver: ${{ steps.m.outputs.ver }}
    steps:
      - uses: actions/checkout@v5
      - id: m
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="testing-latest"
          DATE=$(date -u +%Y-%m-%d)
          VER=$(grep -m1 'MARKETING_VERSION' project.yml | sed -E 's/.*"([^"]+)".*/\1/')
          SHA="${GITHUB_SHA:0:7}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
          TITLE="NOOP Staging — base ${VER} · ${DATE} · ${SHA}"
          NOTES="Rolling **latest** testing build — refreshed in place, so this tag is always the newest. NOOP main + ryanbr's open PRs + vetted community PRs, built with the **NOOP Staging** identity (installs **beside** the official app, separate data). Filenames carry the base app version (\`v${VER}\`).

          - **Android (release)** — \`NOOP-android-v${VER}.apk\` — optimized, non-debuggable build; installs beside the official app. \`com.noop.whoop.staging\`.
          - **Android (debug)** — \`NOOP-android-debug-v${VER}.apk\` — debuggable build. \`com.noop.whoop.debug\`.
          - **macOS** — \`NOOP-macos-v${VER}.zip\` — unzip, then **right-click → Open** (ad-hoc signed, not notarized; Gatekeeper warns once). If it says *\"damaged\"*, run \`xattr -dr com.apple.quarantine /Applications/NOOP.app\`.
          - **iOS** — \`NOOP-ios-unsigned-v${VER}.ipa\` — sideload via **AltStore / Sideloadly** (re-signs on-device); embedded watch app stripped, widget extension retained for Home/Lock-Screen widgets and Live Activities.

          Base app version ${VER} · built ${DATE} · \`${SHA}\`."
          # The tag is now edited IN PLACE rather than deleted-and-recreated on every run. Recreating it
          # briefly invalidated EVERY asset URL — including the previous run's .ipa and, worse, the
          # `altstore-source.json` URL itself — right as AltStore/SideStore (which cache the source's
          # content locally and only re-fetch on an explicit "Refresh", not before every install) could be
          # resolving a still-cached, now-stale reference to it. That produced the exact same "data
          # couldn't be read"/"version doesn't match" install failure as the version-mismatch bug already
          # fixed here, just triggered by a completely different mechanism (a dangling URL, not a
          # mismatched value) and recurring on every subsequent CI run. Editing in place keeps every
          # asset URL from any past run permanently valid, so a stale AltStore cache always still resolves
          # to SOMETHING real (possibly not the newest build until the user refreshes, but never a 404).
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --target "${{ github.sha }}" \
              --title "$TITLE" --notes "$NOTES" --draft=false --prerelease
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --prerelease --target "${{ github.sha }}" \
              --title "$TITLE" --notes "$NOTES"
          fi
          # Belt-and-braces: earlier versions of this job deleted-and-recreated the tag, and that recreate
          # sometimes came back as a DRAFT — the 9.2.1 staging build did, and a draft release does not
          # publish its tag, so the assets were unreachable and the `testing-latest` URL 404'd until someone
          # noticed. Asserting the published state costs one idempotent call and cannot make things worse.
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease
          DRAFT=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft -q .isDraft)
          [ "$DRAFT" = "false" ] || { echo "::error::$TAG is still a draft — testers cannot download it."; exit 1; }

  android:
    needs: meta
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/wrapper-validation@v5
      - uses: gradle/actions/setup-gradle@v5
      # NOTE: both APKs are signed with the committed android/fork-debug.keystore via an explicit
      # storeFile in the debug signingConfig (build.gradle.kts, injected by rebuild-staging.sh) — the
      # release build falls back to the debug key when no keystore.properties is present. We do NOT
      # copy it to ~/.android/debug.keystore — the runner ignores that path (ANDROID_USER_HOME points off
      # $HOME) and would sign with a fresh random key, breaking sideloaded updates ("App not installed").
      # -PstagingRelease gives the release APK a .staging app id so it installs beside the official app.
      - name: Build debug + staging-release APKs
        run: ./gradlew assembleFullDebug assembleFullRelease -PstagingRelease
      - name: Version the filenames + attach
        env:
          GH_TOKEN: ${{ github.token }}
          VER: ${{ needs.meta.outputs.ver }}
        run: |
          cp app/build/outputs/apk/full/debug/*.apk "NOOP-android-debug-v${VER}.apk"
          cp app/build/outputs/apk/full/release/*.apk "NOOP-android-v${VER}.apk"
          gh release upload "${{ needs.meta.outputs.tag }}" \
            "NOOP-android-v${VER}.apk" "NOOP-android-debug-v${VER}.apk" \
            --repo "$GITHUB_REPOSITORY" --clobber

  macos:
    needs: meta
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build NOOP.app (macOS, unsigned, universal)
        # #51: force a true universal (x86_64 + arm64) build — 'platform=macOS' on an Apple-Silicon runner
        # thins to arm64-only. Mirrors the release workflow so testing builds match what ships.
        run: >-
          xcodebuild -scheme Strand -configuration Debug
          -destination 'generic/platform=macOS' ARCHS="x86_64 arm64" ONLY_ACTIVE_ARCH=NO
          -derivedDataPath build/dd
          CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
          build
      - name: Verify universal binary
        run: |
          APP=$(find build/dd/Build/Products -maxdepth 3 -name '*.app' -type d | head -1)
          EXE=$(find "$APP/Contents/MacOS" -maxdepth 1 -type f ! -name '*.dylib' | head -1)
          echo "archs: $(lipo -archs "$EXE")"
          { lipo -archs "$EXE" | grep -qw x86_64 && lipo -archs "$EXE" | grep -qw arm64; } \
            || { echo "::error::macOS binary is not universal (expected x86_64 + arm64)"; exit 1; }
      - name: Package + attach
        env:
          GH_TOKEN: ${{ github.token }}
          VER: ${{ needs.meta.outputs.ver }}
        run: |
          APP=$(find build/dd/Build/Products -maxdepth 3 -name '*.app' -type d | head -1)
          test -n "$APP" || { echo ".app not found"; exit 1; }
          # #429: ad-hoc sign the BUNDLE so it has a stable per-build code identity. macOS 26 (Tahoe) won't
          # bind a Bluetooth TCC grant to an UNSIGNED bundle, so users wedge at CBManagerState .unauthorized
          # even after a fresh `tccutil reset` + approve. `--sign -` gives a real cdhash-based designated
          # requirement TCC can grant to. No --entitlements / --options runtime: stays non-sandboxed so BT
          # goes through plain TCC + the Info.plist usage string. (cdhash still changes per build, so a
          # future UPDATE still needs the re-toggle the in-app #429/#295 banner already describes.)
          codesign --force --deep --sign - "$APP"
          codesign -dvv "$APP" 2>&1 | grep -Ei 'identifier|signature|flags' || true
          ditto -c -k --keepParent "$APP" "NOOP-macos-v${VER}.zip"
          gh release upload "${{ needs.meta.outputs.tag }}" "NOOP-macos-v${VER}.zip" --repo "$GITHUB_REPOSITORY" --clobber

  ios:
    needs: meta
    # iOS 26 Liquid Glass (glassEffect) needs the iOS 26 SDK → Xcode 26 → macos-26.
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build NOOPiOS for device (unsigned, Release)
        # #53: build RELEASE, not Debug. A Debug build carries get-task-allow + debug artifacts that make a
        # re-signed sideload fail "integrity could not be verified" on modern iOS; Release (the correct config
        # for a distributed app) installs clean — confirmed by the reporter's own Release build.
        #
        # CURRENT_PROJECT_VERSION is overridden to the run number so CFBundleVersion actually changes on
        # every build — AltStore/SideStore verify the resigned app's real CFBundleVersion against the
        # source's declared buildVersion (mismatch = hard install failure, not just a warning), and their
        # "update available" check also keys off buildVersion. The static "289" in project.yml never
        # changes, so the source's buildVersion has to track whatever we actually embed here.
        run: >-
          xcodebuild -scheme NOOPiOS -configuration Release -destination 'generic/platform=iOS'
          -derivedDataPath build/dd
          CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
          CURRENT_PROJECT_VERSION="${{ github.run_number }}"
          build
      - name: Package sideload .ipa (strip watch, preserve app/widget capabilities) + attach
        env:
          GH_TOKEN: ${{ github.token }}
          VER: ${{ needs.meta.outputs.ver }}
          BUILD_NUM: ${{ github.run_number }}
        run: |
          APP=$(find build/dd/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -type d | head -1)
          test -n "$APP" || { echo ".app (iphoneos) not found"; exit 1; }
          rm -rf "$APP/Watch"
          # Keep NOOPWidgets.appex. It renders both the Home/Lock-Screen widgets AND the Live Activity;
          # deleting PlugIns still lets ActivityKit create an activity, but iOS can only show an empty
          # Dynamic Island shell because its renderer is gone.
          test -d "$APP/PlugIns/NOOPWidgets.appex" || {
            echo "NOOPWidgets.appex missing from iOS build"; exit 1;
          }
          # Preserve the requested App Group in a replaceable ad-hoc signature so the sideloader
          # provisions the shared container instead of treating both executables as entitlement-free.
          Tools/prepare-ios-sideload-app.sh "$APP"
          rm -rf Payload && mkdir Payload && cp -R "$APP" Payload/
          # A build-number suffix keeps this filename (and thus URL) unique on every run — reusing the
          # same "NOOP-ios-unsigned-v${VER}.ipa" name and --clobbering it left the door open for GitHub's
          # CDN edge cache or the device's own URL cache to keep serving a stale, already-cached .ipa
          # after a fresh upload, so a device could re-download the OLD binary under the new source's
          # (correct) version metadata — producing the exact same "version doesn't match" install failure.
          # Older .ipa assets are deliberately NOT pruned here. A stale cached copy of
          # altstore-source.json (device URL cache, or GitHub's own CDN edge) can still be served for a
          # while after a new run publishes a fresh one — if that stale source points at a build whose
          # .ipa we'd already deleted, install fails with a "data couldn't be read" error that looks
          # identical to the version-mismatch bug this whole per-run-filename scheme was built to fix,
          # except intermittent. Keeping every build's .ipa around means any such stale source still
          # resolves. This is a low-traffic testing release; the storage cost is negligible.
          IPA="NOOP-ios-unsigned-v${VER}-b${BUILD_NUM}.ipa"
          zip -qr "$IPA" Payload
          gh release upload "${{ needs.meta.outputs.tag }}" "$IPA" --repo "$GITHUB_REPOSITORY"
      # Lets AltStore/SideStore offer this build as an in-place UPDATE instead of requiring a manual
      # delete-and-reinstall each time. AltStore Classic's VerifyAppOperation hard-fails the install
      # ("The version of NOOP does not match the version specified by the source") unless `version` here
      # equals the resigned app's real CFBundleShortVersionString EXACTLY, and (if buildVersion is given)
      # `buildVersion` equals its real CFBundleVersion EXACTLY — so neither can be faked independently of
      # what's actually embedded in the .ipa. `version` therefore stays the true MARKETING_VERSION, and
      # BUILD_NUM (== the run number baked into CFBundleVersion by the build step above) is what changes
      # on every run — AltStore's "update available" check compares buildVersion too, so that alone is
      # enough for "Refresh"/"Update" to see a new build each time, no manual reinstall.
      - name: Publish a fresh AltStore/SideStore update source
        env:
          GH_TOKEN: ${{ github.token }}
          VER: ${{ needs.meta.outputs.ver }}
          BUILD_NUM: ${{ github.run_number }}
        run: |
          IPA="NOOP-ios-unsigned-v${VER}-b${BUILD_NUM}.ipa"
          SIZE=$(stat -f%z "$IPA")
          DATE=$(date -u +%Y-%m-%d)
          SHA="${GITHUB_SHA:0:7}"
          REPO_URL="https://github.com/${GITHUB_REPOSITORY}"
          # Both sourceURL AND downloadURL point at raw.githubusercontent.com (a dedicated
          # `altstore-source` branch), NOT releases/download URLs. A release-asset download is a 302 to
          # a SIGNED Azure Blob URL with a long, query-heavy signature — on-device this measurably came
          # back as an HTML page ("Encountered unknown tag html", NSCocoaErrorDomain 3840) even for a
          # freshly-generated, byte-correct source and a freshly-verified-good .ipa (confirmed good by
          # fetching the SAME URL from a completely different network right after the failure), while a
          # plain source Refresh (no redirect involved once it moved off releases/download) started
          # working. That isolates the redirect hop itself — not the content, not staleness/expiry — as
          # what the device's networking stack chokes on for both files equally, so both need to be off
          # of it. raw.githubusercontent.com serves directly with zero redirects.
          RAW_BASE_URL="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/altstore-source"
          RAW_SOURCE_URL="${RAW_BASE_URL}/altstore-source.json"
          RAW_IPA_URL="${RAW_BASE_URL}/${IPA}"
          cat > altstore-source.json <<JSON
          {
            "name": "NOOP (fork testing)",
            "identifier": "com.noopapp.noop.altstore.staging",
            "sourceURL": "${RAW_SOURCE_URL}",
            "subtitle": "Rolling testing builds — refreshed on every CI run.",
            "description": "Rolling testing-build source for this fork of NOOP. Refreshed on every CI run so AltStore/SideStore always offers the newest build as an in-place update — no manual delete-and-reinstall.",
            "iconURL": "${REPO_URL}/raw/main/Strand/Resources/Assets.xcassets/AppIcon.appiconset/icon_512x512.png",
            "website": "${REPO_URL}",
            "tintColor": "44E2B0",
            "apps": [
              {
                "name": "NOOP",
                "bundleIdentifier": "com.noopapp.noop",
                "developerName": "NoopApp",
                "subtitle": "Rolling testing build.",
                "localizedDescription": "Testing build from ${REPO_URL}. Rebuilt on demand; the build number changes every run so AltStore/SideStore always sees this as an update, never a reinstall.",
                "iconURL": "${REPO_URL}/raw/main/Strand/Resources/Assets.xcassets/AppIcon.appiconset/icon_512x512.png",
                "tintColor": "44E2B0",
                "category": "healthcare-fitness",
                "screenshotURLs": [],
                "version": "${VER}",
                "versionDate": "${DATE}",
                "versionDescription": "Base app version ${VER} (build ${BUILD_NUM}), built ${DATE} (${SHA}).",
                "downloadURL": "${RAW_IPA_URL}",
                "size": ${SIZE},
                "minOSVersion": "17.0",
                "versions": [
                  {
                    "version": "${VER}",
                    "buildVersion": "${BUILD_NUM}",
                    "date": "${DATE}",
                    "localizedDescription": "Base app version ${VER}, built ${DATE} (${SHA}).",
                    "downloadURL": "${RAW_IPA_URL}",
                    "size": ${SIZE},
                    "minOSVersion": "17.0"
                  }
                ]
              }
            ]
          }
          JSON
          python3 -c "import json; json.load(open('altstore-source.json'))"
          # Releases still get both files too — a plain browser download (Sideloadly, manual install)
          # follows redirects fine; only the on-device AltStore/SideStore fetch of a releases/download
          # URL was the problem.
          gh release upload "${{ needs.meta.outputs.tag }}" altstore-source.json --repo "$GITHUB_REPOSITORY" --clobber
          # Publish both files to the `altstore-source` branch so raw.githubusercontent.com serves them
          # at RAW_SOURCE_URL/RAW_IPA_URL above. Built as a FRESH orphan commit and force-pushed (not an
          # incremental commit onto the branch's existing history) so a new ~20MB .ipa blob every run
          # doesn't grow that branch without bound — each push fully replaces the previous one.
          rm -rf /tmp/altstore-source-branch && mkdir /tmp/altstore-source-branch
          cp altstore-source.json "$IPA" /tmp/altstore-source-branch/
          # A second, STABLE-named copy of the same .ipa. The build-numbered name above is what the
          # AltStore/SideStore source points at (those verify the exact build they were told about), but
          # a manual iLoader/Sideloadly install just needs "the current one" — and with a name that
          # changes every run, that means chasing down a fresh link for every single update. This one
          # never changes, so it can be bookmarked once.
          cp "$IPA" /tmp/altstore-source-branch/NOOP-latest.ipa
          git -C /tmp/altstore-source-branch init -q -b altstore-source
          git -C /tmp/altstore-source-branch config user.name "github-actions[bot]"
          git -C /tmp/altstore-source-branch config user.email "github-actions[bot]@users.noreply.github.com"
          git -C /tmp/altstore-source-branch add -A
          git -C /tmp/altstore-source-branch commit -q -m "Build ${VER}.${BUILD_NUM} (${SHA})"
          git -C /tmp/altstore-source-branch push -f \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "HEAD:refs/heads/altstore-source"

  # Fork-only housekeeping: the disposable `noop-staging` branch exists ONLY to feed this build. Once every
  # platform job has finished (pass OR fail — always()), delete it so GitHub's "Compare & pull request"
  # banner doesn't linger after each run. The rolling release tag (testing-latest) pins the built sha, so
  # deleting the branch orphans nothing. Guarded to the disposable branch name — a run dispatched from main
  # (or any other ref) is left alone.
  cleanup:
    needs: [meta, android, macos, ios]
    if: ${{ always() && github.ref_type == 'branch' && github.ref_name == 'noop-staging' }}
    runs-on: ubuntu-latest
    steps:
      - name: Delete the disposable staging branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/noop-staging" || true
